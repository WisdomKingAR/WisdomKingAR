<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="ar-title ar-desc">
  <title id="ar-title">Aaryan Raorane</title>
  <desc id="ar-desc">Aspiring AI engineer and cybersecurity practitioner. B.Tech AI and Data Science student at DJSCE, Mumbai. A small terminal types out current role, last shipped project and grades.</desc>
  <defs>
    <pattern id="ar-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F5F5F5" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="ar-name" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8A8A8A"/>
    </linearGradient>
    <linearGradient id="ar-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ar-underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ar-vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="ar-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .beam { animation: ar-sweep 9s linear infinite; }
    .trace { stroke-dasharray: 1400; stroke-dashoffset: 0; animation: ar-draw 4.5s ease-out 0.2s both; }
    .uline { transform-origin: 56px 0; animation: ar-grow 1.2s ease-out 0.5s both; }
    .rise { animation: ar-rise 0.8s ease-out both; }
    .type { animation: ar-type 0.7s steps(30, end) both; }
    .cursor { opacity: 0; animation: ar-blink 1.1s steps(1, end) infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: ar-pulse 2s ease-in-out infinite; }
    @keyframes ar-sweep { from { transform: translateX(-420px); } to { transform: translateX(1100px); } }
    @keyframes ar-draw { from { stroke-dashoffset: 1400; } to { stroke-dashoffset: 0; } }
    @keyframes ar-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes ar-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ar-type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes ar-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes ar-pulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(2.2); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .beam, .trace, .uline, .rise, .type, .cursor, .pulse { animation: none !important; }
    }
  </style>

  <!-- canvas -->
  <rect width="1000" height="340" fill="#000000"/>
  <rect width="1000" height="340" fill="url(#ar-grid)"/>
  <rect class="beam" x="0" y="0" width="420" height="340" fill="url(#ar-beam)"/>

  <!-- circuit trace -->
  <path class="trace" pathLength="1400" d="M0 316 H130 L152 298 H340 L362 316 H540 L562 332 H700 L722 316 H1000"
        fill="none" stroke="#F5F5F5" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle cx="152" cy="298" r="3" fill="#F5F5F5" fill-opacity="0.5"/>
  <circle cx="362" cy="316" r="3" fill="#F5F5F5" fill-opacity="0.5"/>
  <circle cx="722" cy="316" r="3" fill="#F5F5F5" fill-opacity="0.5"/>

  <!-- left column -->
  <g class="rise" style="animation-delay:0.1s">
    <rect x="56" y="52" width="268" height="28" rx="14" fill="#0A0A0A" stroke="#F5F5F5" stroke-opacity="0.14"/>
    <circle cx="76" cy="66" r="4" fill="#4ADE80"/>
    <circle class="pulse" cx="76" cy="66" r="4" fill="#4ADE80"/>
    <text class="mono" x="90" y="70" font-size="12" fill="#A3A3A3">Open to winter 2026 internships</text>
  </g>

  <g class="rise" style="animation-delay:0.25s">
    <text class="mono" x="56" y="150" font-size="52" font-weight="700" fill="url(#ar-name)" letter-spacing="-1">Aaryan</text>
    <text class="mono" x="56" y="208" font-size="52" font-weight="700" fill="url(#ar-name)" letter-spacing="-1">Raorane</text>
  </g>
  <rect class="uline" x="56" y="222" width="220" height="2" fill="url(#ar-underline)"/>
  <rect x="56" y="221" width="220" height="4" fill="#FFFFFF" fill-opacity="0.12" filter="url(#ar-glow)"/>

  <g class="rise" style="animation-delay:0.6s">
    <text class="mono" x="56" y="256" font-size="14" fill="#F5F5F5">Aspiring AI Engineer // Cybersecurity track</text>
    <text class="mono" x="56" y="280" font-size="12" fill="#A3A3A3">B.Tech AI and Data Science, DJSCE Mumbai</text>
  </g>

  <!-- terminal -->
  <g class="rise" style="animation-delay:0.4s">
    <rect x="560" y="52" width="400" height="236" rx="10" fill="#0D0D0D" stroke="#F5F5F5" stroke-opacity="0.12"/>
    <path d="M560 62a10 10 0 0 1 10-10h380a10 10 0 0 1 10 10V80H560Z" fill="#111111"/>
    <circle cx="580" cy="66" r="5" fill="#FF5F56"/>
    <circle cx="598" cy="66" r="5" fill="#FFBD2E"/>
    <circle cx="616" cy="66" r="5" fill="#27C93F"/>
    <text class="mono" x="760" y="70" font-size="11" fill="#A3A3A3" text-anchor="middle">wisdomkingar@portfolio</text>
  </g>

  <g class="mono" font-size="14">
    <text class="type" style="animation-delay:1.0s;animation-timing-function:steps(6,end)" x="580" y="112" fill="#F5F5F5"><tspan fill="#27C93F">&gt; </tspan>whoami</text>
    <text class="type" style="animation-delay:1.7s;animation-timing-function:steps(30,end)" x="580" y="134" fill="#A3A3A3">aaryan raorane // WisdomKingAR</text>
    <text class="type" style="animation-delay:2.6s;animation-timing-function:steps(14,end)" x="580" y="164" fill="#F5F5F5"><tspan fill="#27C93F">&gt; </tspan>status --now</text>
    <text class="type" style="animation-delay:3.3s;animation-timing-function:steps(28,end)" x="580" y="186" fill="#A3A3A3">AI/ML Mentee, DJS InfoMatrix</text>
    <text class="type" style="animation-delay:4.2s;animation-timing-function:steps(15,end)" x="580" y="216" fill="#F5F5F5"><tspan fill="#27C93F">&gt; </tspan>last --shipped</text>
    <text class="type" style="animation-delay:4.9s;animation-timing-function:steps(20,end)" x="580" y="238" fill="#A3A3A3">CivicFix, Ignite 8.0</text>
    <text class="type" style="animation-delay:5.6s;animation-timing-function:steps(8,end)" x="580" y="268" fill="#F5F5F5"><tspan fill="#27C93F">&gt; </tspan>grades</text>
    <text class="type" style="animation-delay:6.1s;animation-timing-function:steps(22,end)" x="672" y="268" fill="#A3A3A3">Sem 1 9.74, Sem 2 9.70</text>
    <rect class="cursor" x="864" y="256" width="8" height="14" fill="#F5F5F5" style="animation-delay:7s"/>
  </g>

  <rect width="1000" height="340" fill="url(#ar-vignette)"/>
</svg>
