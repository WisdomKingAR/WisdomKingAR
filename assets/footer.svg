<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 90" width="1000" height="90" role="img" aria-labelledby="ar-f-title">
  <title id="ar-f-title">Aaryan Raorane, WisdomKingAR</title>
  <defs>
    <linearGradient id="ar-f-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F5F5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F5F5F5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F5F5F5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ar-f-spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
    .spark { animation: ar-f-run 5s ease-in-out infinite; }
    .cursor { opacity: 0; animation: ar-f-blink 1.1s steps(1, end) infinite; }
    @keyframes ar-f-run { from { transform: translateX(-200px); } to { transform: translateX(1000px); } }
    @keyframes ar-f-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .spark, .cursor { animation: none !important; } .spark { display: none; } }
  </style>
  <rect width="1000" height="90" fill="#000000"/>
  <rect x="0" y="30" width="1000" height="1" fill="url(#ar-f-line)"/>
  <rect class="spark" x="0" y="29" width="200" height="3" fill="url(#ar-f-spark)"/>
  <text class="mono" x="500" y="62" font-size="13" fill="#A3A3A3" text-anchor="middle">Aaryan Raorane // WisdomKingAR</text>
  <rect class="cursor" x="622" y="52" width="7" height="12" fill="#F5F5F5"/>
</svg>
